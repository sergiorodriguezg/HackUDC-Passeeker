<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Passeeker - Conectar</title>
  <style>
    body { font-family: Arial, sans-serif; width: 360px; padding: 14px; }
    h2 { margin: 0 0 6px 0; }
    .muted { color: #555; font-size: 13px; line-height: 1.35; }
    button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; }
    button.primary { font-weight: 700; }
    pre { white-space: pre-wrap; word-break: break-word; background:#f5f5f5; padding:10px; border-radius:10px; margin-top:12px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>¿Conectar con Passeeker Desktop?</h2>
  <div class="muted">
    Detecté que la app está abierta y con la sesión iniciada. Si conectas ahora, la extensión podrá
    rellenar y guardar credenciales.
  </div>

  <button class="primary" id="yes">Sí, conectar</button>
  <button id="no">Ahora no</button>

  <pre id="out">Listo.</pre>

  <script src="connect.js"></script>
</body>
</html>
